name: Update bindings

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Xray-core version (e.g., 1.2.3). Leave empty for latest.'
        required: false
        type: string

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install grpcio-tools build more-itertools

      - name: Fetch versions
        id: versions
        run: |
          cd scripts
          if [ -n "${{ inputs.target_version }}" ]; then
            python -m fetch_versions "XTLS/Xray-core" "$GITHUB_STEP_SUMMARY" "$GITHUB_OUTPUT" --target-version "${{ inputs.target_version }}"
          else
            python -m fetch_versions "XTLS/Xray-core" "$GITHUB_STEP_SUMMARY" "$GITHUB_OUTPUT"
          fi

      - name: Clone Xray-core source
        if: steps.versions.outputs.needs_update == 'true'
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: v${{ steps.versions.outputs.latest_upstream_version }}
          path: xray-src
          fetch-depth: 1

      - name: Compile protobuf files
        if: steps.versions.outputs.needs_update == 'true'
        run: python scripts/compile.py xray-src xray

      - name: Update version in pyproject.toml
        if: steps.versions.outputs.needs_update == 'true'
        run: sed -i "s/^version = .*/version = \"${{ steps.versions.outputs.new_version }}\"/" pyproject.toml

      - name: Build Python package
        if: steps.versions.outputs.needs_update == 'true'
        run: python -m build

      - name: Commit, tag, and push
        if: steps.versions.outputs.needs_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update Python bindings to match Xray-core v${{ steps.versions.outputs.latest_upstream_version }}
          file_pattern: 'xray/ pyproject.toml'
          tag_name: v${{ steps.versions.outputs.new_version }}
          tagging_message: v${{ steps.versions.outputs.new_version }}

      - name: Create GitHub Release
        if: steps.versions.outputs.needs_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.new_version }}
          name: v${{ steps.versions.outputs.new_version }}
          prerelease: ${{ steps.versions.outputs.is_prerelease }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            Updated Python bindings to match **Xray-core v${{ steps.versions.outputs.latest_upstream_version }}**

            ## Installation:

            ### From PyPI (Recommended)
            ```bash
            pip install python-xray-api
            ```

            ### From GitHub Release (Wheel)
            ```bash
            pip install https://github.com/iineolineii/python-xray-api/releases/download/v${{ steps.versions.outputs.new_version }}/python_xray_api-${{ steps.versions.outputs.new_version }}-py3-none-any.whl
            ```

            ### From source
            ```bash
            pip install git+https://github.com/iineolineii/python-xray-api.git@v${{ steps.versions.outputs.new_version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.versions.outputs.needs_update == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Final Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ✅ Update completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ❌ Update failed" >> $GITHUB_STEP_SUMMARY
          fi
